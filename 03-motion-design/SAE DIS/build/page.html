<script>
// SAE DIS, 30s. One continuous camera: logo stripes -> signal lines -> DIS panel -> logic -> HMI -> stripes -> logo.
// Page contract: renderAt(t), TOTAL, ready, EVENTS, ?t= for a still, ?scale=2 for 4K. Render with --gpu.

// ---------------------------------------------------------------- BEATS (all timing lives here)
const BEAT = {
  sweep: [0.15, 1.5],        // shot 1: four stripes sweep in
  fadeStripes: [1.5, 2.9],   // stripes hand over to the blue signal lines
  pulses: 2.0,               // light starts travelling along the lines
  l1: [3.0, 6.7],            // "Connect the assets that matter."
  chips: [6.2, 10.1],        // protocol tags ride the lines into the DIS
  l2: [7.2, 10.2],           // "Speak the language of your assets."
  enter: 11.55,              // camera passes through the DIS window
  l3: [11.9, 15.0],          // "From field signals to on-site decisions."
  blocks: [12.2, 12.9, 13.6, 14.3],   // each logic block lights in turn
  code: [12.3, 14.0],        // Structured Text line types on
  grow: [14.7, 16.3],        // "Act & display" block becomes the HMI
  badges: [16.5, 17.7],      // HMI status lights turn green
  alarm: 18.4,               // oil-temp alarm toast slides in
  l4: [16.5, 19.6],          // "See the result at the site."

  promise: [23.9, 26.0],     // "Connect the field. / Process at the edge. / See the result."
  rise: [26.4, 27.2],        // stripes slide up into the logo position
  cut: [27.0, 27.4],         // gaps open: S | A | E
  build: [27.2, 28.0],       // S, A, E rise out of the stripes
  word: [27.7, 28.3],        // MALAYSIA
  cta: [28.0, 28.7],         // URL + call to action
  sweepLight: [28.3, 29.0],  // light sweep across the logo
  END: 30,
};
window.EVENTS = [
  { name: 'stripes_in', t: BEAT.sweep[0] }, { name: 'pull_back', t: 0.9 }, { name: 'pulses', t: BEAT.pulses },
  { name: 'line1', t: BEAT.l1[0] }, { name: 'chips', t: BEAT.chips[0] }, { name: 'line2', t: BEAT.l2[0] },
  { name: 'push_in', t: 10.4 }, { name: 'through_window', t: BEAT.enter }, { name: 'line3', t: BEAT.l3[0] },
  ...BEAT.blocks.map((t, i) => ({ name: 'block_' + (i + 1), t })), { name: 'hmi_grow', t: BEAT.grow[0] },
  { name: 'line4', t: BEAT.l4[0] }, ...[0, 1, 2, 3, 4].map(i => ({ name: 'badge_ok', t: BEAT.badges[0] + i * 0.3 })),
  { name: 'alarm', t: BEAT.alarm }, { name: 'pull_back_2', t: 19.6 }, { name: 'line5', t: BEAT.l5[0] },
  { name: 'squash', t: BEAT.squash[0] }, { name: 'promise', t: BEAT.promise[0] }, { name: 'logo_build', t: BEAT.build[0] },
  { name: 'logo_land', t: BEAT.build[1] }, { name: 'cta', t: BEAT.cta[0] }, { name: 'light_sweep', t: BEAT.sweepLight[0] }, { name: 'end', t: 30 },
];

// ---------------------------------------------------------------- setup
const END = BEAT.END, W = 1920, H = 1080, q = new URLSearchParams(location.search), SCALE = parseFloat(q.get('scale') || '1');
const cv = document.getElementById('c'); cv.width = W * SCALE; cv.height = H * SCALE; const MAIN = cv.getContext('2d');
const mk = (w = cv.width, h = cv.height) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const TMP = mk(), ACC = mk(), S3 = GL3D.create(W * SCALE, H * SCALE);
const clamp01 = v => Math.max(0, Math.min(1, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp01((t - a) / (b - a));
const outExpo = k => (k = clamp01(k)) >= 1 ? 1 : 1 - Math.pow(2, -10 * k), outCubic = k => 1 - Math.pow(1 - clamp01(k), 3);
const inOutCubic = k => { k = clamp01(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }, sine = k => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(k));
const mixC = (a, b, k) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`;
const C = { navy: [11, 31, 58], deep: [6, 13, 26], sig: '#3D8BFF', ok: '#2BD47D', ink: '#F2F5FA', mute: '#8FA3C0', bad: '#E5484D' };
const TS = 2;   // texture supersampling

function tex(w, h, draw) {   // a 2D-canvas texture panel; redraw(...args) skips identical args
  const c = document.createElement('canvas'); c.width = Math.round(w * TS); c.height = Math.round(h * TS); const p = { c, w, h, tex: null, key: null };
  p.redraw = (...a) => { const key = JSON.stringify(a); if (key === p.key && p.tex) return p; p.key = key; const g = c.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height); g.setTransform(TS, 0, 0, TS, 0, 0); draw(g, ...a);
    if (p.tex) p.tex.update(); else p.tex = S3.texture(c); return p; };
  return p;
}
const rr = (g, x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };

// ---------------------------------------------------------------- monotone camera keys (C1, no overshoot, no reversals)
function track(keys) {   // keys: [[t, v], ...] -> f(t), Fritsch-Carlson monotone cubic
  const n = keys.length, x = keys.map(k => k[0]), y = keys.map(k => k[1]), d = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (x[i + 1] - x[i]));
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 3 * (x[i + 1] - x[i - 1]) / ((2 * x[i + 1] - x[i] - x[i - 1]) / d[i - 1] + (x[i + 1] + x[i] - 2 * x[i - 1]) / d[i]);
  m[0] = 0; m[n - 1] = 0;
  return t => { if (t <= x[0]) return y[0]; if (t >= x[n - 1]) return y[n - 1]; let i = 0; while (t > x[i + 1]) i++;
    const h = x[i + 1] - x[i], s = (t - x[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * y[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * y[i + 1] + (s3 - s2) * h * m[i + 1]; };
}
const HMI_Z = -1800, HMI_X = 600;
const CAM = {
  ex: track([[0, -1450], [3.2, -1440], [6.5, -1180], [9.4, -70], [10.6, 0], [14.6, 0], [16.3, HMI_X], [19.6, HMI_X + 90], [23.6, HMI_X + 420], [24.2, HMI_X + 440]]),
  ey: track([[0, 130], [3.2, 128], [9.4, 95], [11.0, 60], [12.4, 40], [19.6, 40], [23.6, 260], [24.2, 270]]),
  ez: track([[0, 470], [0.5, 510], [1.4, 1200], [2.4, 1850], [3.6, 2120], [6.2, 2200], [9.4, 1720], [10.5, 1150], [11.2, 330], [11.8, -40], [12.6, -95], [16.3, -110],
             [19.6, -125], [20.6, 300], [22.4, 2300], [23.6, 2750], [24.2, 2800]]),
  tx: track([[0, -1400], [3.2, -1390], [6.5, -1000], [9.4, -40], [10.0, 0], [14.6, 0], [16.3, HMI_X], [24.2, HMI_X]]),
  ty: track([[0, 0], [14.6, 0], [16.3, 45], [19.6, 45], [22.6, 170], [24.2, 180]]),
  tz: track([[0, 0], [9.6, 0], [10.6, -500], [11.6, -1500], [12.2, HMI_Z], [24.2, HMI_Z]]),

function camera(t) {
  return { eye: [CAM.ex(t), CAM.ey(t), CAM.ez(t)], target: [CAM.tx(t), CAM.ty(t), CAM.tz(t)], fov: 34,
    focus: Math.hypot(CAM.ex(t) - CAM.tx(t), CAM.ey(t) - CAM.ty(t), CAM.ez(t) - CAM.tz(t)), aperture: 0.9,
    fog: { near: 4400, far: 11000, color: C.deep.map(v => v / 255) } };
}

// ---------------------------------------------------------------- world: field network
const ASSETS = [{ y: 270, name: 'Transformer' }, { y: 90, name: 'Feeder pillar' }, { y: -90, name: 'Energy meter' }, { y: -270, name: 'PV + storage' }];
const NET = { x0: -2340, x1: -200, y0: -520, y1: 520 };   // network texture bounds (world)
const BUS = [36, 12, -12, -36], PORT = [54, 18, -18, -54];
function bez(p0, p1, p2, p3, n) { const o = []; for (let i = 1; i <= n; i++) { const s = i / n, u = 1 - s; o.push([u * u * u * p0[0] + 3 * u * u * s * p1[0] + 3 * u * s * s * p2[0] + s * s * s * p3[0], u * u * u * p0[1] + 3 * u * u * s * p1[1] + 3 * u * s * s * p2[1] + s * s * s * p3[1]]); } return o; }
const LINES = ASSETS.map((a, i) => {   // polyline in world x/y (z = 0): asset -> bus -> DIS port
  let pts = [[-2120, a.y]]; pts = pts.concat(bez([-2120, a.y], [-1900, a.y], [-1950, BUS[i]], [-1750, BUS[i]], 40));
  pts.push([-1050, BUS[i]]); pts = pts.concat(bez([-1050, BUS[i]], [-700, BUS[i]], [-600, PORT[i]], [-232, PORT[i]], 40));
  const L = [0]; for (let k = 1; k < pts.length; k++) L.push(L[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
  return { pts, L, len: L[L.length - 1] };
});
function along(line, u) { const s = clamp01(u) * line.len; let k = 1; while (k < line.L.length - 1 && line.L[k] < s) k++;
  const f = (s - line.L[k - 1]) / Math.max(1e-6, line.L[k] - line.L[k - 1]); return [lerp(line.pts[k - 1][0], line.pts[k][0], f), lerp(line.pts[k - 1][1], line.pts[k][1], f)]; }

const T = {};
function drawNet(g, col) {
  g.translate(-NET.x0, NET.y1); g.scale(1, -1); g.lineCap = 'round'; g.lineJoin = 'round';
  for (const ln of LINES) { g.beginPath(); ln.pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.strokeStyle = col; g.lineWidth = 11; g.stroke(); }
  g.fillStyle = col; for (const ln of LINES) { const [x, y] = ln.pts[0]; g.beginPath(); g.arc(x, y, 13, 0, 7); g.fill(); }
}
function drawAsset(g, i) {   // clean line-art icons (centre 110,90 in a 220x220 tile)
  g.strokeStyle = '#A9C1E4'; g.fillStyle = '#132640'; g.lineWidth = 5; g.lineJoin = 'round'; g.lineCap = 'round';
  g.save(); g.translate(110, 92);
  if (i === 0) { rr(g, -52, -34, 104, 76, 8); g.fill(); g.stroke(); for (const x of [-66, -76, 66, 76]) { g.beginPath(); g.moveTo(x, -26); g.lineTo(x, 34); g.stroke(); }
    for (const x of [-26, 0, 26]) { g.beginPath(); g.moveTo(x, -34); g.lineTo(x, -64); g.stroke(); g.beginPath(); g.arc(x, -68, 5, 0, 7); g.stroke(); } }
  if (i === 1) { rr(g, -40, -62, 80, 124, 8); g.fill(); g.stroke(); g.beginPath(); g.moveTo(0, -62); g.lineTo(0, 62); g.stroke();
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 10, -8); g.lineTo(s * 10, 8); g.stroke(); } g.beginPath(); g.moveTo(-48, 62); g.lineTo(48, 62); g.stroke(); }
  if (i === 2) { rr(g, -46, -58, 92, 116, 12); g.fill(); g.stroke(); rr(g, -28, -40, 56, 24, 4); g.stroke(); g.beginPath(); g.arc(0, 18, 22, Math.PI, 2 * Math.PI); g.stroke();
    g.beginPath(); g.moveTo(0, 18); g.lineTo(14, 4); g.stroke(); }
  if (i === 3) { g.beginPath(); g.moveTo(-90, 34); g.lineTo(-62, -30); g.lineTo(22, -30); g.lineTo(-6, 34); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-76, 2); g.lineTo(8, 2); g.moveTo(-48, -30); g.lineTo(-62, 34); g.moveTo(-20, -30); g.lineTo(-34, 34); g.stroke();
    rr(g, 40, -38, 46, 72, 6); g.fill(); g.stroke(); g.beginPath(); g.moveTo(54, -46); g.lineTo(72, -46); g.stroke(); g.beginPath(); g.moveTo(52, 0); g.lineTo(74, 0); g.stroke(); }
  g.restore(); g.font = '600 24px UI'; g.fillStyle = '#C9D7EC'; g.textAlign = 'center'; g.fillText(ASSETS[i].name, 110, 206);
}
function drawGlow(g, col) { const r = g.createRadialGradient(40, 40, 0, 40, 40, 40); r.addColorStop(0, col); r.addColorStop(0.25, col.replace('1)', '0.55)')); r.addColorStop(1, col.replace('1)', '0)')); g.fillStyle = r; g.fillRect(0, 0, 80, 80); }
function drawChip(g, s, w) { rr(g, 3, 3, w - 6, 50, 25); g.fillStyle = 'rgba(20,46,86,0.95)'; g.fill(); g.lineWidth = 3; g.strokeStyle = 'rgba(61,139,255,0.9)'; g.stroke();
  g.font = '600 24px UI'; g.fillStyle = '#DCE8FF'; g.textAlign = 'center'; g.fillText(s, w / 2, 37); }
const CHIPS = ['IEC 104', 'Modbus TCP', 'IEC 62056-21', 'MQTT'];

// ---------------------------------------------------------------- world: DIS enclosure (rebuilt as shapes from the panel photo)
const DIS = { w: 460, h: 580, d: 170, win: { x: 80, y: 70, w: 300, h: 230 } };   // window in panel coords (top-left origin)
function drawDIS(g) {
  const { w, h, win } = DIS; const body = g.createLinearGradient(0, 0, w, h); body.addColorStop(0, '#D9DCD6'); body.addColorStop(1, '#B7BBB3');
  g.fillStyle = body; rr(g, 0, 0, w, h, 16); g.fill(); g.strokeStyle = '#A3A79F'; g.lineWidth = 4; rr(g, 14, 14, w - 28, h - 28, 10); g.stroke();

  g.fillStyle = '#7E827A'; rr(g, w - 52, 300, 18, 92, 8); g.fill();   // handle
  for (const [x, c] of [[110, '#2BD47D'], [150, '#F5B83D']]) { g.fillStyle = c; g.beginPath(); g.arc(x, 352, 10, 0, 7); g.fill(); }
  g.fillStyle = '#114B9B'; g.font = '700 34px UI'; g.fillText('SAE DIS', 80, 470); g.fillStyle = '#5E625B'; g.font = '400 19px UI'; g.fillText('Distribution Interface Switch', 80, 500);

const solid = col => tex(8, 8, g => { g.fillStyle = col; g.fillRect(0, 0, 8, 8); });

// ---------------------------------------------------------------- world: logic chain
const BLK = { w: 300, h: 161, xs: [-600, -200, 200, 600], names: [['Acquire', 'field values'], ['Calculate', 'logic + equations'], ['Evaluate', 'conditions'], ['Act & display', 'outputs + HMI']] };
function drawBlock(g, i, lit) {
  const { w, h } = BLK; rr(g, 3, 3, w - 6, h - 6, 18); g.fillStyle = lit > 0 ? mixC([15, 39, 72], [19, 64, 120], lit) : '#0F2748'; g.fill();
  g.lineWidth = 4; g.strokeStyle = lit > 0 ? mixC([61, 139, 255], i === 3 ? [43, 212, 125] : [150, 200, 255], lit) : 'rgba(61,139,255,0.7)'; g.stroke();

}
const CODE = 'IF oil_temp > limit THEN alarm := TRUE;';
function drawCode(g, n) { g.font = '500 28px Code'; g.fillStyle = '#7F98BD'; g.fillText(CODE.slice(0, n), 0, 32); if (n < CODE.length) { const x = g.measureText(CODE.slice(0, n)).width; g.fillStyle = '#3D8BFF'; g.fillRect(x + 3, 8, 3, 30); } }

// ---------------------------------------------------------------- HMI screens (faithful vector rebuilds of the ELMINA PE 16 screens; site names generalised)
const HW = 1500, HH = 806;
function hmiFrame(g, title) {
  g.fillStyle = '#EEF0F2'; g.fillRect(0, 0, HW, HH); g.fillStyle = '#E2E5E9'; g.fillRect(0, 0, HW, 78); g.fillStyle = '#C9CED5'; g.fillRect(0, 78, HW, 2);
  g.strokeStyle = '#D23A35'; g.lineWidth = 4; rr(g, 20, 20, 40, 38, 6); g.stroke(); g.beginPath(); g.moveTo(28, 48); g.lineTo(40, 30); g.lineTo(52, 48); g.stroke();
  g.fillStyle = '#2B2F36'; g.font = '600 28px UI'; g.fillText('PE16', 76, 50);
  const nav = ['MAIN', 'COMM', 'ELECT', 'SLD', 'SOE', 'AML']; nav.forEach((s, i) => { const x = 200 + i * 88; g.fillStyle = '#2B2F36'; rr(g, x + 22, 16, 28, 26, 4); g.fill(); g.font = '600 15px UI'; g.textAlign = 'center'; g.fillText(s, x + 36, 64); g.textAlign = 'left'; });
  g.fillStyle = '#1D2128'; g.font = '700 32px UI'; g.textAlign = 'center'; g.fillText(title, 860, 52);
  g.fillStyle = '#E53935'; g.fillRect(1010, 14, 200, 50); g.fillStyle = '#fff'; g.font = '600 17px UI'; g.fillText('NOP', 1110, 35); g.fillText('SWITCHING', 1110, 56);
  g.fillStyle = '#21E05A'; g.fillRect(1268, 18, 128, 44); g.fillStyle = '#0B3D1C'; g.font = '600 20px UI'; g.fillText('LOG-IN', 1332, 47);
  g.fillStyle = '#2B2F36'; g.font = '500 17px UI'; g.fillText('10:01:55', 1448, 36); g.fillText('01.10.2026', 1448, 58); g.textAlign = 'left';
}
function tag(g, x, y, s, w = 120) { g.fillStyle = '#A9AEB5'; rr(g, x, y, w, 34, 6); g.fill(); g.fillStyle = '#fff'; g.font = '700 20px UI'; g.textAlign = 'center'; g.fillText(s, x + w / 2, y + 25); g.textAlign = 'left'; }

const ICON = {
  tx(g, x, y) { g.fillStyle = '#C64A3E'; g.fillRect(x, y, 120, 26); g.fillStyle = '#9FB3C6'; rr(g, x + 14, y + 26, 92, 80, 6); g.fill(); g.fillStyle = '#7A8C9E'; for (let k = 0; k < 6; k++) g.fillRect(x + 20 + k * 15, y + 32, 6, 68); g.fillStyle = '#2B2F36'; g.fillRect(x + 2, y + 40, 10, 70); g.fillRect(x + 108, y + 40, 10, 70); },

// ---------------------------------------------------------------- 3D -> 2D handover (screens collapse into the four stripes)
const squashK = t => inOutCubic(prog(t, BEAT.squash[0], BEAT.squash[1]));

function quadOf(p, cam, v0 = 0, v1 = 1) {   // screen corners TL, TR, BL for the panel's rows v0..v1

    const [a, b, c] = Q.map((q, j) => [lerp(q[0], R[j][0], ki), lerp(q[1], R[j][1], ki)]);

}
const stripeRise = t => (ly(LOGO.stripes ? LOGO.stripes[0][0] : 112.8) - STRIPE_Y7[0]) * inOutCubic(prog(t, BEAT.rise[0], BEAT.rise[1]));

// ---------------------------------------------------------------- text: word by word, blur to sharp with a small rise
function line(g, text, t, t0, t1, y, size = 60) {
  if (t < t0 - 0.01 || t > t1 + 0.8) return; g.save(); g.font = `600 ${size}px UI`; g.letterSpacing = `${-size * 0.03}px`; g.textBaseline = 'alphabetic';
  const words = text.split(' '), sp = g.measureText(' ').width, ws = words.map(w => g.measureText(w).width), total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let x = W / 2 - total / 2;
  words.forEach((w, i) => {
    const kin = sine(prog(t, t0 + i * 0.08, t0 + i * 0.08 + 0.55)), kout = sine(prog(t, t1 + i * 0.05, t1 + i * 0.05 + 0.45)), a = kin * (1 - kout);

      const yy = y + (1 - kin) * 16 - kout * 12, gr = g.createLinearGradient(0, yy - size * 0.72, 0, yy); gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.5, '#FFFFFF'); gr.addColorStop(1, '#AEB9CB');
      g.fillStyle = gr; g.fillText(w, x, yy); }
    x += ws[i] + sp;

}

// ---------------------------------------------------------------- shots 7-8 (2D): stripes, promise, logo build
function drawEnd(g, t) {

  g.save(); g.translate(LG.X, LG.Y); g.scale(LG.s, LG.s); g.translate(-LG.cx, -LG.cy);
  const dy = (STRIPE_Y7[0] + stripeRise(t) - ly(LOGO.stripes[0][0])) / LG.s;
  g.fillStyle = '#FFFFFF';
  if (t > BEAT.squash[1]) LOGO.stripes.forEach(([y, h], i) => {
    const yy = y + dy;
    g.globalAlpha = 1 - cut; g.fillRect(24, yy, 426.5, h);
    g.globalAlpha = cut; for (const c of ['S', 'A', 'E']) { g.save(); g.clip(LOGO.clip[c]); g.fillRect(0, yy, 480, h); g.restore(); }
  });

    g.save(); g.beginPath(); g.rect(0, 0, 480, 108.6); g.clip(); g.translate(0, (1 - k) * 100); g.fill(LOGO[c]); g.restore(); });
  // MALAYSIA, letter by letter
  LOGO.letters.forEach((p, i) => { const k = sine(prog(t, BEAT.word[0] + i * 0.05, BEAT.word[0] + i * 0.05 + 0.45)); if (k <= 0) return;
    g.save(); g.globalAlpha = k; g.filter = `blur(${(1 - k) * 6 * SCALE}px)`; g.translate(0, (1 - k) * 8); g.fill(p); g.restore(); });
  // light sweep across the logo
  const ls = prog(t, BEAT.sweepLight[0], BEAT.sweepLight[1]);
  if (ls > 0 && ls < 1) { g.save(); const all = new Path2D(); ['S', 'A', 'E'].forEach(c => all.addPath(LOGO[c])); LOGO.letters.forEach(p => all.addPath(p)); g.clip(all);
    const x = lerp(-60, 540, ls), gr = g.createLinearGradient(x - 60, 0, x + 60, 0); gr.addColorStop(0, 'rgba(120,180,255,0)'); gr.addColorStop(0.5, 'rgba(120,180,255,0.85)'); gr.addColorStop(1, 'rgba(120,180,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 480, 240); g.restore(); }
  g.restore();

  if (c > 0) { g.save(); g.textAlign = 'center'; g.globalAlpha = c; g.filter = `blur(${(1 - c) * 8 * SCALE}px)`; g.fillStyle = '#FFFFFF'; g.font = '600 44px UI'; g.letterSpacing = '-1px'; g.fillText('sae-malaysia.com', W / 2, 818 + (1 - c) * 12);
    g.globalAlpha = c2; g.filter = `blur(${(1 - c2) * 8 * SCALE}px)`; g.fillStyle = '#A9BBD6'; g.font = '400 28px UI'; g.letterSpacing = '0px'; g.fillText('Talk to us about your DIS application.', W / 2, 868 + (1 - c2) * 12); g.restore(); }
  const iso = sine(prog(t, BEAT.cta[0] + 0.3, BEAT.cta[1] + 0.3));
  if (iso > 0 && LOGO.iso.naturalWidth) { g.save(); g.globalAlpha = iso * 0.92; const w = 190, h = w * LOGO.iso.naturalHeight / LOGO.iso.naturalWidth; rr(g, W - 64 - w, H - 56 - h, w, h, 6); g.clip(); g.drawImage(LOGO.iso, W - 64 - w, H - 56 - h, w, h); g.restore(); }
}

// ---------------------------------------------------------------- frame
function background(g, t) {

  g.fillStyle = col; g.fillRect(0, 0, W, H);
  const glow = (1 - toNavy) * toDeep, r = g.createRadialGradient(W / 2, H * 0.47, 0, W / 2, H * 0.47, W * 0.62); r.addColorStop(0, `rgba(30,70,130,${0.45 * glow})`); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, W, H);
}
function vignette(g) { const r = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.75); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,0.35)'); g.fillStyle = r; g.fillRect(0, 0, W, H); }

  line(g, 'Speak the language of your assets.', t, BEAT.l2[0], BEAT.l2[1], 128);
  line(g, 'From field signals to on-site decisions.', t, BEAT.l3[0], BEAT.l3[1], 150);
  line(g, 'See the result at the site.', t, BEAT.l4[0], BEAT.l4[1], 96, 54);
  line(g, 'Process locally. Operate intelligently.', t, BEAT.l5[0], BEAT.l5[1], 1000, 54);
  line(g, 'Connect the field.', t, BEAT.promise[0], BEAT.promise[1], 380, 68);
  line(g, 'Process at the edge.', t, BEAT.promise[0] + 0.55, BEAT.promise[1] + 0.1, 480, 68);
  line(g, 'See the result.', t, BEAT.promise[0] + 1.1, BEAT.promise[1] + 0.2, 580, 68);

}
const SUB = +(q.get('sub') || 12), SHUTTER = 0.5 / 25;   // motion blur: sub-frames over a 180-degree shutter at 25 fps
let built = false;
function render(t) {

  const fast = [[0, 3.4], [10.0, 12.6], [14.6, 16.4], [19.8, 24.2], [26.3, 28.2]].some(([x, y]) => t >= x && t <= y);   // full motion blur on fast moves only
  const n = still ? 1 : (q.has('sub') ? SUB : fast ? 12 : 6), A = ACC.getContext('2d'); A.setTransform(1, 0, 0, 1, 0, 0); A.globalAlpha = 1; A.clearRect(0, 0, ACC.width, ACC.height);
  for (let i = 0; i < n; i++) { const ts = n === 1 ? t : Math.max(0, Math.min(END, t + (i / (n - 1) - 0.5) * SHUTTER)); const g = TMP.getContext('2d'); frame(g, ts);

window.TOTAL = END; window.renderAt = t => render(t);
window.ready = Promise.all([document.fonts.load('600 60px UI'), document.fonts.load('400 20px UI'), document.fonts.load('700 20px UI'), document.fonts.load('500 20px Code'), loadLogo()]).catch(e => console.error(e))
  .then(() => { if (q.has('t')) render(parseFloat(q.get('t'))); else (function tick(n) { render((n / 1000) % END); requestAnimationFrame(tick); })(0); return true; });
</script></body></html>
